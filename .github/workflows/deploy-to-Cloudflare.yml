# ------------------------------------------------------------
# Workflow Name : Deploy to Cloudflare
# Trigger       : release type publish
# Purpose       :
#   - Cloudflare workers にデプロイする
# ------------------------------------------------------------
name: Deploy to Cloudflare

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: '承認済み公開commit SHA（40桁）'
        required: true
        type: string

env:
  NODE_VERSION: "24.x"
  PNPM_VERSION: "10.33.0"
  TARGET_GH_INSTALLATION_ID: ${{ vars.TARGET_GH_INSTALLATION_ID }}

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    concurrency:
      group: cloudflare-deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify approved commit and Org installation
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$TARGET_GH_INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]]
          test "$TARGET_GH_INSTALLATION_ID" != "99269804"
          test "$TARGET_GH_INSTALLATION_ID" != "1"
          printf 'Commit: %s\nOrg installation: %s\n' "$EXPECTED_SHA" "$TARGET_GH_INSTALLATION_ID" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm i --frozen-lockfile

      - name: Deploy with cf
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_GH_SECRET: ${{ secrets.TARGET_GH_SECRET }}
        run: |
          secrets_file="$RUNNER_TEMP/cloudflare-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e "require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/cloudflare-secrets.json', JSON.stringify({ TARGET_GH_SECRET: process.env.TARGET_GH_SECRET }), { mode: 0o600 })"
          pnpm run deploy --secrets-file "$secrets_file"
